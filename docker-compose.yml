services:
  banco:
    image: postgres:16
    environment:
      POSTGRES_DB: dataflow
      POSTGRES_USER: dataflow
      POSTGRES_PASSWORD: dataflow
    ports:
      - "5432:5432"
    volumes:
      - dados-banco:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataflow"]
      interval: 5s
      retries: 10

  app:
    build: .
    profiles: ["app"]
    depends_on:
      banco:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://banco:5432/dataflow
      DB_USER: dataflow
      DB_PASSWORD: dataflow
      DATAFLOW_ARQUIVOS: /app/dados/arquivos
      # obrigatória: sem ela (ou com a senha de desenvolvimento) o sistema não inicia
      DATAFLOW_ADMIN_SENHA: ${DATAFLOW_ADMIN_SENHA:-}
    ports:
      - "8080:8080"
    volumes:
      - dados-arquivos:/app/dados

volumes:
  dados-banco:
  dados-arquivos:
