# mesmas opções do perfil local; DEFAULT_NULL_ORDERING=HIGH imita o PostgreSQL (nulos no fim em ORDER BY ... ASC)
spring.datasource.url=jdbc:h2:mem:dataflow-teste;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# igual ao application.properties principal (este arquivo o substitui nos testes)
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
dataflow.armazenamento.diretorio=${java.io.tmpdir}/dataflow-auto-testes
dataflow.armazenamento.tamanho-maximo-mb=1
dataflow.fichas.fonte-demonstracao=true
dataflow.fichas.api-placa.url=
dataflow.fichas.api-placa.token=
dataflow.fotos.diretorio=${java.io.tmpdir}/dataflow-auto-testes/fotos
dataflow.admin.senha=dataflow123
dataflow.admin.senha-padrao-permitida=true
