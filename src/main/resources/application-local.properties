# Perfil para rodar sem PostgreSQL: banco H2 em arquivo dentro de ./dados
spring.datasource.url=jdbc:h2:file:./dados/dataflow-h2;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
# Rodando de dentro da pasta do projeto, telas e CSS são lidos direto de src/:
# qualquer mudança aparece com F5 no navegador, sem reiniciar a loja.
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=file:src/main/resources/templates/
spring.web.resources.static-locations=file:src/main/resources/static/
spring.web.resources.cache.period=0
# Senha de desenvolvimento do painel: aceita só neste perfil (fora dele, defina DATAFLOW_ADMIN_SENHA)
dataflow.admin.senha=${DATAFLOW_ADMIN_SENHA:dataflow123}
dataflow.admin.senha-padrao-permitida=true
