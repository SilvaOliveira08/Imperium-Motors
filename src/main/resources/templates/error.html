<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: head('Erro')}"></head>
<body>
<header th:replace="~{fragmentos/layout :: cabecalho('')}"></header>
<main class="container">
    <section class="cartao centro">
        <h1 th:text="${status == 404} ? 'Página não encontrada' : 'Algo deu errado'">Algo deu errado</h1>
        <p th:text="${mensagem != null and status == 404} ? ${mensagem} : 'Não foi possível concluir a operação. Tente novamente; se o problema continuar, verifique o log da aplicação.'"></p>
        <a class="botao" th:href="@{/}">Voltar ao início</a>
    </section>
</main>
<footer th:replace="~{fragmentos/layout :: rodape}"></footer>
</body>
</html>
