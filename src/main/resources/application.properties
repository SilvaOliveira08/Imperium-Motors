spring.application.name=dataflow-auto

# Banco de dados (PostgreSQL via docker compose). Sobrescreva com variáveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dataflow}
spring.datasource.username=${DB_USER:dataflow}
spring.datasource.password=${DB_PASSWORD:dataflow}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# fichas, campos e fotos dos anúncios são buscados em lotes de até 50, e não um carro por vez (catálogo da loja)
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.flyway.enabled=true

# Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
# Pasta de trabalho do Tomcat (inclui os arquivos temporários dos uploads) dentro de ./dados, e não em /tmp:
# o Linux limpa /tmp de tempos em tempos, e aí todo upload passaria a falhar.
server.tomcat.basedir=${DATAFLOW_TOMCAT_DIR:./dados/tomcat}
dataflow.armazenamento.diretorio=${DATAFLOW_ARQUIVOS:./dados/arquivos}
dataflow.armazenamento.tamanho-maximo-mb=10

# Fichas técnicas
dataflow.fichas.fonte-demonstracao=true
# API de consulta por placa (desligada enquanto a URL estiver vazia)
dataflow.fichas.api-placa.url=${API_PLACA_URL:}
dataflow.fichas.api-placa.token=${API_PLACA_TOKEN:}

server.error.whitelabel.enabled=false
spring.thymeleaf.cache=false
server.servlet.session.tracking-modes=cookie

# Loja de veículos
# Login da equipe no painel (a loja pública não exige login). Sem DATAFLOW_ADMIN_SENHA o sistema não inicia;
# a senha de desenvolvimento só é aceita no perfil local (veja application-local.properties).
dataflow.admin.usuario=${DATAFLOW_ADMIN_USUARIO:admin}
dataflow.admin.senha=${DATAFLOW_ADMIN_SENHA:}
# Contra força bruta: depois de 5 senhas erradas seguidas do mesmo IP para o mesmo usuário,
# esse IP fica 15 minutos sem conseguir entrar (mesmo com a senha certa)
dataflow.seguranca.login.maximo-falhas=5
dataflow.seguranca.login.janela-minutos=15
dataflow.fotos.diretorio=${DATAFLOW_FOTOS:./dados/fotos}
# Nome da loja: padrão "Vértice Veículos" (em DadosLoja.java). Para trocar, defina DATAFLOW_LOJA_NOME.
dataflow.loja.telefone=${DATAFLOW_LOJA_TELEFONE:(19) 3333-0000}
dataflow.loja.whatsapp=${DATAFLOW_LOJA_WHATSAPP:5519999990000}
# Endereço público do site, usado nos links dos textos de divulgação. Troque ao publicar (ex.: https://www.suaLoja.com.br).
dataflow.loja.site=${DATAFLOW_LOJA_SITE:http://localhost:8080}
dataflow.loja.endereco=${DATAFLOW_LOJA_ENDERECO:Av. das Amoreiras, 1000 - Campinas/SP}
# Taxa mensal usada só na simulação de financiamento exibida ao cliente
dataflow.loja.taxa-financiamento=${DATAFLOW_TAXA_FINANCIAMENTO:1.79}
